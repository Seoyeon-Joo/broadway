# 일회성 디버그: 후보 대본 사이트의 robots/sitemap/샘플 페이지를 debug/script-sources 브랜치에 저장 (파서 개발용)
name: Debug fetch script sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python scripts/debug_fetch_sources.py
      - name: Push snapshot to debug branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug/script-sources4
          git rm -rq --cached .
          git add debug_html
          git commit -qm "debug snapshot"
          git push -f origin debug/script-sources4
