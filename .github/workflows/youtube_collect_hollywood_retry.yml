name: Hollywood YouTube 재수집 (누락/저수집 영화)

# data/hollywood_youtube_retry_targets.csv 에 있는 영화만 다시 수집한다.
#   - search_title / is_rerelease / title_ambiguous 를 고친 버전 (fix_reason 컬럼 참고)
#   - 결과는 shard_retry.csv 로 hollywood-youtube-data Release에 저장
#     -> merge 스크립트가 shard_*.csv 를 전부 합치므로 기존 결과에 자동으로 붙음
#        (movie_id+video_id 중복은 제거됨)
#   - 체크포인트는 shard_retry.processed.txt 로 따로 둬서 기존 shard 체크포인트와 안 섞임
#   - 14편 x 24쿼리 x 최대 2페이지라 quota를 많이 씀 -> 전체 키를 다 씀.
#     quota가 끝나면 중간에 멈추고, 다시 Run workflow 하면 이어서 수집함.
on:
  workflow_dispatch:
    inputs:
      limit_per_show:
        description: "영화 1편당 최대 수집 영상 수"
        default: "200"
      max_pages_per_query:
        description: "쿼리 하나당 최대 페이지 수"
        default: "2"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  YOUTUBE_DATA_TAG: hollywood-youtube-data

jobs:
  collect-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: (있다면) 이전 재수집 진행 상황 받아오기
        run: |
          mkdir -p data/youtube_hollywood
          gh release download "$YOUTUBE_DATA_TAG" --dir data/youtube_hollywood \
            --pattern "shard_retry.*" --clobber 2>/dev/null || \
            echo "기존 재수집 데이터 없음 (첫 실행)"

      - name: 재수집 대상 영화 YouTube 영상 수집
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
        run: |
          python -u scripts/youtube_collect_hollywood.py \
            --targets data/hollywood_youtube_retry_targets.csv \
            --out data/youtube_hollywood/shard_retry.csv \
            --shard-index 0 --num-shards 1 \
            --limit 100 \
            --limit-per-show "${{ github.event.inputs.limit_per_show }}" \
            --max-pages-per-query "${{ github.event.inputs.max_pages_per_query }}"

      - name: 결과를 Release에 업로드
        if: always()
        run: |
          bash scripts/checkpoint_release.sh "$YOUTUBE_DATA_TAG" \
            data/youtube_hollywood/shard_retry.csv \
            data/youtube_hollywood/shard_retry.processed.txt

  merge:
    needs: collect-retry
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas

      - name: 모든 shard 결과 받아오기 (shard_retry 포함)
        run: |
          mkdir -p data/youtube_hollywood
          gh release download "$YOUTUBE_DATA_TAG" --dir data/youtube_hollywood \
            --pattern "shard_*.csv" --clobber
          ls -la data/youtube_hollywood/

      - name: shard 병합
        run: |
          python scripts/merge_hollywood_youtube_shards.py \
            --shard-dir data/youtube_hollywood \
            --out data/hollywood_youtube_merged.csv \
            --targets data/hollywood_youtube_targets.csv

      - name: 병합 결과를 Release에 업로드
        run: |
          bash scripts/checkpoint_release.sh "$YOUTUBE_DATA_TAG" data/hollywood_youtube_merged.csv

      - name: 안전망 - Actions 아티팩트로도 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-youtube-merged-retry
          path: data/hollywood_youtube_merged.csv
          retention-days: 30
          if-no-files-found: ignore
