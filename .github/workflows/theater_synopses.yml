name: Theater synopses (4 Broadway plays)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl beautifulsoup4
      - run: python scripts/theater_synopses.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theater_synopses_candidates.xlsx
          git diff --staged --quiet || git commit -m "Theater synopses candidates [automated]"
          git pull --rebase origin synopsis-theater
          git push
