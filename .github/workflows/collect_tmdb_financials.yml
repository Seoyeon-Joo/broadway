name: Collect TMDB budget/revenue (Hollywood)

# Secret TMDB_API_KEY 필요. 결과: data/tmdb_financials_hollywood.xlsx
# This product uses the TMDB API but is not endorsed or certified by TMDB.

on:
  push:
    branches: [synopsis-rematch]
    paths:
      - scripts/collect_tmdb_financials.py
      - .github/workflows/collect_tmdb_financials.yml

permissions:
  contents: write

jobs:
  fin:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl
      - name: Collect
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/collect_tmdb_financials.py --targets data/synopsis_targets_hollywood.xlsx --out data/tmdb_financials_hollywood.xlsx
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tmdb_financials_hollywood.xlsx
          git diff --staged --quiet || git commit -m "TMDB financials [automated]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
