name: Collect Transcripts (t2 videos with cuts)

# 컷수 분석이 끝난(shots_status == ok) t2 요약 영상 중, 영어 자막이 아직 없는 영상의 자막을 수집한다.
# 컷수가 새로 채워진 뒤 다시 실행하면 새로 생긴 영상만 수집된다.
# 수집 후에는 "Compute Similarity (sharded)" 를 실행하면 유사도가 새로 계산된다.
on:
  workflow_dispatch:
    inputs:
      retry:
        description: "기존 기록 중 다시 시도할 status (쉼표 구분). 예: error 또는 error,no_transcript"
        required: false
        default: "error"
      limit:
        description: "디버그용: 샤드당 수집할 영상 수 제한 (0 = 전체)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect-transcripts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "youtube-transcript-api>=1.2,<2" pandas openpyxl
      - name: Collect transcripts
        env:
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
          RETRY: ${{ github.event.inputs.retry }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--out-dir transcripts_out --shard-count 4 --shard-index ${{ matrix.shard }} --retry ${RETRY:-error}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python scripts/collect_transcripts.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcripts-shard-${{ matrix.shard }}
          path: transcripts_out/
          if-no-files-found: ignore

  merge:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl
      - uses: actions/download-artifact@v4
        with:
          pattern: transcripts-shard-*
          merge-multiple: true
          path: transcripts_in
      - name: Merge into youtube_transcripts_all.xlsx
        run: python scripts/merge_transcripts.py --shards transcripts_in | tee data/similarity/transcripts_last_run.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit updated transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/similarity/youtube_transcripts_all.xlsx data/similarity/transcripts_last_run.txt
          git diff --cached --quiet || git commit -m "Update transcripts (new t2 videos with cuts) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
