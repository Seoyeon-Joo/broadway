# .github/workflows/collect_scripts.yml
#
# 영화 대본 통합 수집: data/movie_list.xlsx 의 영화마다 대본 1개씩 저장
#   우선순위: SimplyScripts 수상시즌 > Script Slug > SimplyScripts 전체목록 > Deadline 기사 > PDF 링크 모음 페이지
#            > Scripts On Screen(무료 링크만) > archive.org > IMSDb > Daily Script
#   대본이 끝내 없으면 대사 전사본(Springfield! Springfield!)을 transcripts-txt 로 따로 저장 (status=transcript_only)
#   previous_run_id 에 이전 실행 번호를 넣으면 그때 받은 영화는 건너뛰고, 결과 엑셀은 누적으로 만듭니다.
#   재개봉작(제목의 "2022 Re-release" 등)은 원작 대본으로, 공연·UFC·오페라 등 영화가 아닌 것은 non_film 으로 분류.
#   앞 순위 링크가 깨져 있으면 다음 후보로 자동으로 넘어갑니다.
#   개봉연도(data/hollywood.xlsx 의 첫 박스오피스 연도)로 후보 순서를 정하고 year_check 열에 표시합니다.
#   죽은 링크는 Wayback Machine 보관본으로, 스캔본 PDF는 OCR(tesseract)로 처리합니다 (txt 앞에 [OCR] 표시).
#
# 실행: Actions > Collect screenplays > Run workflow
# 결과(Artifacts):
#   scripts-results : script_collection.xlsx (영화별 상태/출처/URL/연도검증/후보 목록)
#   scripts-txt     : <movie_id>_<제목>.txt
#   scripts-original: 원본 pdf/html/txt

name: Collect screenplays

on:
  workflow_dispatch:
    inputs:
      match_only:
        description: "매칭 결과만 만들기 (다운로드 안 함)"
        type: boolean
        default: false
      previous_run_id:
        description: "(선택) 이전 Collect screenplays 실행 번호 — 이미 받은 영화는 건너뜀"
        default: ""
      titles:
        description: "(선택) 이 제목들만 실행, | 로 구분 — 디버깅용"
        default: ""
      fuzzy:
        description: "퍼지 매칭 최소 점수 (0-100, 연도 검증된 경우에만 적용)"
        default: "92"
      shard_count:
        description: "(선택) 병렬로 몇 개로 나눠 돌릴지 — 예: 3 이면 같은 previous_run_id로 shard_index 0/1/2 를 동시에 Run workflow"
        default: "1"
      shard_index:
        description: "(선택) 이 실행이 처리할 shard 번호 (0부터 shard_count-1 까지)"
        default: "0"

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          pip install "pandas>=2.2" "openpyxl>=3.1" "requests>=2.32" "beautifulsoup4>=4.12" "rapidfuzz>=3.9" \
                      "pypdf>=4.0" "pymupdf>=1.24" "pytesseract>=0.3.10" "pillow>=10" "gdown>=5.2"

      - name: Download previous results
        if: ${{ github.event.inputs.previous_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.event.inputs.previous_run_id }}" -R "${{ github.repository }}" -n scripts-results -D prev
          ls -la prev

      - name: Collect screenplays
        run: |
          PREV=""
          if [ -f prev/script_collection.xlsx ]; then
            PREV="--previous prev/script_collection.xlsx"
          elif [ -f prev/script_collection.partial.csv ]; then
            # final xlsx wasn't written (e.g. previous run was cancelled/timed out) -
            # fall back to the incremental partial CSV so that progress isn't lost
            PREV="--previous prev/script_collection.partial.csv"
          fi
          echo "Using previous results: ${PREV:-<none>}"
          python scripts/collect_scripts.py \
            --input data/movie_list.xlsx \
            --release-years data/hollywood.xlsx \
            --output data/script_collection.xlsx \
            --txt-dir data/scripts_txt \
            --raw-dir data/scripts_raw \
            --fuzzy "${{ github.event.inputs.fuzzy || '92' }}" \
            --titles "${{ github.event.inputs.titles }}" $PREV \
            --shard-count "${{ github.event.inputs.shard_count || '1' }}" \
            --shard-index "${{ github.event.inputs.shard_index || '0' }}" \
            ${{ github.event.inputs.match_only == 'true' && '--match-only' || '' }}

      - name: Commit results xlsx to repo
        if: always()
        run: |
          # separate branch per shard: concurrent shards force-pushing the same branch
          # would stomp on each other's results
          BRANCH="data-results-s${{ github.event.inputs.shard_index || '0' }}"
          if [ -f data/script_collection.xlsx ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f data/script_collection.xlsx
            [ -f data/script_collection.partial.csv ] && git add -f data/script_collection.partial.csv
            git commit -m "Update script_collection.xlsx [skip ci]"
            # push straight to a dedicated results branch (force) -- avoids racing the
            # concurrent stage-scripts/shorts pipelines that push to main throughout the day
            if git push --force origin "HEAD:$BRANCH"; then
              echo "pushed ok -> $BRANCH"
            else
              echo "::error::push to $BRANCH failed"
              exit 1
            fi
          else
            echo "::warning::data/script_collection.xlsx not found, nothing to commit"
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-results
          path: |
            data/script_collection.xlsx
            data/script_collection.partial.csv
          if-no-files-found: warn

      - name: Upload txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-txt
          path: data/scripts_txt/
          if-no-files-found: warn

      - name: Upload originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-original
          path: data/scripts_raw/
          if-no-files-found: warn

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-txt
          path: data/transcripts_txt/
          if-no-files-found: warn
