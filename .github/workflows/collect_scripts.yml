# .github/workflows/collect_scripts.yml
#
# 영화 대본 통합 수집: data/movie_list.xlsx 의 영화마다 대본 1개씩 txt로 저장
#   우선순위: SimplyScripts 수상시즌(스튜디오 공개 대본) > SimplyScripts 전체목록 > IMSDb > Daily Script
#   앞 순위 링크가 깨져 있으면 다음 후보로 자동으로 넘어갑니다.
#   개봉연도(data/hollywood.xlsx 의 첫 박스오피스 연도)로 후보 순서를 정하고 year_check 열에 표시합니다.
#   죽은 링크는 Wayback Machine 보관본으로, 스캔본 PDF는 OCR(tesseract)로 처리합니다 (txt 앞에 [OCR] 표시).
#
# 실행: Actions > Collect screenplays > Run workflow
# 결과(Artifacts):
#   scripts-results : script_collection.xlsx (영화별 상태/출처/URL/연도검증/후보 목록)
#   scripts-txt     : <movie_id>_<제목>.txt
#   scripts-original: 원본 pdf/html/txt

name: Collect screenplays

on:
  workflow_dispatch:
    inputs:
      match_only:
        description: "매칭 결과만 만들기 (다운로드 안 함)"
        type: boolean
        default: false
      titles:
        description: "(선택) 이 제목들만 실행, | 로 구분 — 디버깅용"
        default: ""
      fuzzy:
        description: "퍼지 매칭 최소 점수 (0-100, 연도 검증된 경우에만 적용)"
        default: "92"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          pip install "pandas>=2.2" "openpyxl>=3.1" "requests>=2.32" "beautifulsoup4>=4.12" "rapidfuzz>=3.9" \
                      "pypdf>=4.0" "pymupdf>=1.24" "pytesseract>=0.3.10" "pillow>=10" "gdown>=5.2"

      - name: Collect screenplays
        run: |
          python scripts/collect_scripts.py \
            --input data/movie_list.xlsx \
            --release-years data/hollywood.xlsx \
            --output data/script_collection.xlsx \
            --txt-dir data/scripts_txt \
            --raw-dir data/scripts_raw \
            --fuzzy "${{ github.event.inputs.fuzzy || '92' }}" \
            --titles "${{ github.event.inputs.titles }}" \
            ${{ github.event.inputs.match_only == 'true' && '--match-only' || '' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-results
          path: |
            data/script_collection.xlsx
            data/script_collection.partial.csv
          if-no-files-found: warn

      - name: Upload txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-txt
          path: data/scripts_txt/
          if-no-files-found: warn

      - name: Upload originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-original
          path: data/scripts_raw/
          if-no-files-found: warn
