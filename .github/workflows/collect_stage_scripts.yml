# .github/workflows/collect_stage_scripts.yml
#
# 브로드웨이 공연 대본(뮤지컬은 악보 포함) 수집 — data/shows_list.csv (find 열이 O/S 인 공연은 건너뜀)
#   archive.org(무료 다운로드 / 대출 링크) · Project Gutenberg(저작권 만료 희곡) · Open Library(출판 판본)
#   · MTI / TRW(공연권 회사 페이지)
# 결과(Artifacts): stage-results (stage_scripts.xlsx) · stage-files (받은 대본/악보 파일)

name: Collect stage scripts

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=2.2" "openpyxl>=3.1" "requests>=2.32"
      - run: python scripts/collect_stage_scripts.py
      - name: Commit results xlsx to repo
        if: always()
        run: |
          if [ -f data/stage_scripts.xlsx ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f data/stage_scripts.xlsx
            git commit -m "Update stage_scripts.xlsx [skip ci]"
            # push straight to a dedicated results branch (force) -- avoids racing the
            # concurrent movie/shorts pipelines that push to main throughout the day
            if git push --force origin HEAD:data-results; then
              echo "pushed ok"
            else
              echo "::error::push to data-results failed"
              exit 1
            fi
          else
            echo "::warning::data/stage_scripts.xlsx not found, nothing to commit"
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-results
          path: data/stage_scripts.xlsx
          if-no-files-found: warn
      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-files
          path: data/stage_files/
          if-no-files-found: warn
