name: Collect Synopses - All works (Broadway + Hollywood)

# Broadway(data/synopsis_targets_broadway.xlsx), Hollywood(data/synopsis_targets_hollywood.xlsx) 전체 작품의
# 영어 Wikipedia 줄거리를 모아 data/synopses_broadway.xlsx, data/synopses_hollywood.xlsx 로 저장한다.
# 수동 실행: Actions 탭 > Collect Synopses - All works > Run workflow (이 파일을 푸시해도 1회 실행됨)

on:
  workflow_dispatch: {}
  push:
    branches: [synopsis-scraper]
    paths:
      - .github/workflows/collect_synopses_all.yml

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: broadway,   targets: data/synopsis_targets_broadway.xlsx,   shard: "1/2"}
          - {name: broadway,   targets: data/synopsis_targets_broadway.xlsx,   shard: "2/2"}
          - {name: hollywood,  targets: data/synopsis_targets_hollywood.xlsx,  shard: "1/4"}
          - {name: hollywood,  targets: data/synopsis_targets_hollywood.xlsx,  shard: "2/4"}
          - {name: hollywood,  targets: data/synopsis_targets_hollywood.xlsx,  shard: "3/4"}
          - {name: hollywood,  targets: data/synopsis_targets_hollywood.xlsx,  shard: "4/4"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas openpyxl
      - name: Run collector (shard)
        run: |
          S="${{ matrix.shard }}"
          python scripts/collect_synopses.py --targets "${{ matrix.targets }}" --shard "$S" --out "part_${{ matrix.name }}_${S/\//of}.xlsx"
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.name }}_${{ strategy.job-index }}
          path: part_*.xlsx

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part_*
          merge-multiple: true
      - name: Merge shards
        run: python scripts/merge_synopsis_parts.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/synopses_broadway.xlsx data/synopses_hollywood.xlsx
          git diff --staged --quiet || git commit -m "Update all-works synopses [automated]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: synopses_all
          path: |
            data/synopses_broadway.xlsx
            data/synopses_hollywood.xlsx
