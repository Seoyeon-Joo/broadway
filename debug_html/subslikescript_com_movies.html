<html>
  <head>
    <title>Loading...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/captcha-protect-poj.js" async defer referrerpolicy="no-referrer"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader {
        text-align: center;
      }

      .dots {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
      }

      .dot {
        width: 14px;
        height: 14px;
        background: #667eea;
        border-radius: 50%;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%            { transform: scale(1);   opacity: 1;   }
      }

      .text {
        font-size: 15px;
        color: #999;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="text">Loading...</div>
    </div>

    <form action="/challenge" method="post" id="captcha-form" accept-charset="UTF-8" style="display:none">
      <div
          data-callback="captchaCallback"
          class="poj-captcha"
          data-sitekey="unused"
          data-theme="auto"
          data-size="normal"
          data-language="auto"
          data-retry="auto"
          interval="8000"
          data-appearance="always">
      </div>
      <input type="hidden" name="destination" value="/movies">
    </form>

    <script type="text/javascript">
        function captchaCallback(token) {
            document.getElementById("captcha-form").submit();
        }
    </script>
  </body>
</html>
