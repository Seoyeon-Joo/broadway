contains a stipulation to, or admission or acknowledgment of, any wrongdoing (whether in tort or otherwise) on the part of Disney or any of the Disney Companies.\n\n10.\tNO ADVERTISING, SOLICITATION OR ENDORSEMENT\n\nYou shall acquire no right to use, and shall not, directly or indirectly, assist any other party to use the names “Disney,” “ABC,” “ESPN,” “Pixar,” “Marvel” or “Lucasfilm” (either alone or in conjunction with or as a part of any other word or name) or any fanciful characters or designs of Disney or any of the Disney Companies (a) in any advertising, publicity or promotion or other disclosure, (b) n any in-house publication, (c) to express or imply any endorsement of any product or service or (d) in any other manner or for any purpose whatsoever (whether or not similar to any of the foregoing). Additionally, you shall not be entitled to any credit or attribution, unless expressly approved in writing by Disney, which may be granted or withheld in Disney’s sole discretion.\n\n11.\tTERMINATION\n\nDisney, in its sole discretion and at any time without any liability, shall be entitled to terminate your access to the Debut Service and use of the Content, including, but not limited to, (a) if we believe you are accessing or have accessed the Debut Service, or are using or have used the Content, in violation of these Terms of Use, the Guidelines, the Notices and Restrictions, applicable law or regulations or in any manner other than for their intended purpose, (b) if you are in breach of any of the terms of the Agreement or (c) if you did not access the Debut Service in the prior 180 days. In addition, you understand that we may modify or cease providing all or a portion of the Debut Service at any time without notice. Your authorization to access the Debut Service and use the Content shall also terminate upon the expiration or sooner termination of the Agreement.\n\n12.\tDISCLAIMERS AND LIMITATION ON LIABILITY\n\nTHE DEBUT SERVICE AND CONTENT ARE PROVIDED “AS I this VECTOR Privacy Notice. Other members of The Walt Disney Family of Companies may have access to your information where they perform services on behalf of the Data Controller(s) (as a Data Processor), and unless prohibited under applicable law for use on their own behalf (as a Data Controller) for the purposes described in this VECTOR Privacy Notice.\n\nThis VECTOR Privacy Notice also applies to the collection and use of your Personal Information by any member of The Walt Disney Family of Companies that may need access to information you have provided.\n\nINFORMATION WE COLLECT\n\nInformation You Provide\n\nWe may collect Personal Information (as defined in this VECTOR Privacy Notice) and anonymous information about you which is relevant to our business relationship with you, such as:\n\nRegistration information you provide when you create an account, or link your profile on a third-party site or platform with your registration account, such as your first name and username, country of residence, gender, date of birth, email address, and password;\nInformation sent either one-to-one or within a limited group using our message, chat, post, or similar functionality, where we are permitted by applicable law to collect this information;\nInformation in connection with an employment application, including contact information, work authorization status, CV\u002Fresume, previous work experience and education information, skills, references, work-related licenses, permits and certifications; any other information you elect to provide to us (e.g., awards or professional memberships);\nLocation information, including location information provided by a mobile or other device interacting with one of our sites or applications (including through beacon technologies), or associated with your IP address, with your consent and where we are permitted by law to process this information;\nActivity information about your use, and the use by any person(s) you authorize through your account, of our sites and applications, such as the content you view or post, how often you use our services, and your preferences; and\nUsage, viewing, technical, and device data when you visit our sites, use our applications on third-party sites or platforms, or open emails we send, including your browser or device type, unique device identifier, and IP address.\nCookies And Similar Technologies\n\nONLINE TRACKING TECHNOLOGIES AND ADVERTISING\nWe and certain service providers operating on our behalf collect information about your activity, or activity on devices associated with you, on our sites and applications using tracking technologies such as cookies, Flash cookies, pixels, tags, software development kits, application program interfaces, and Web beacons. Definitions for some of the tracking technologies listed, as well as information about your choices with respect to them, are available below. This tracking data may be used for many purposes including, for example, to:\n\nProvide useful features to simplify your experience when you return to our sites and applications (for example, remembering your language preference);\nDeliver relevant content based on your preferences, usage patterns and location;\nMonitor, evaluate, and optimize the use and operation of our sites and applications; and\nAnalyze traffic on our sites and on the sites of third parties.\nWe may collect information whether or not you are logged in or registered, and may associate this tracking data with your registration account (if you have one), in which case we will treat it as Personal Information. Service providers that collect tracking data on our behalf may provide an opportunity for you to choose not to be tracked online.\n\nAdvertisers and third parties also may collect information about your activity on our sites and applications, on devices associated with you, and on third-party sites and applications using tracking technologies. Tracking data collected by these advertisers and third parties is used to decide which ads you see both on our sites and applications and on third-party sites and applications.\n\nYou may choose not to receive targeted advertising from many ad networks and partners, data exchanges, and marketing analytics and other digital advertising and marketing service providers. You may also be able to choose to control targeted advertising on other websites and platforms that you visit. In addition, you may also choose to control targeted advertising you receive within applications by using the settings and controls on your devices (for example, by re-setting your mobile device’s advertising identifier and\u002For opting out of interest based ads). We adhere to the Digital Advertising Alliance’s Self-Regulatory Principles for Online Behavioral Advertising.\n\nExamples of online tracking technologies include:\nCookies. Cookies are pieces of information that a website places on the hard drive of your computer when you visit the website. Cookies may involve the transmission of information from us to you and from you directly to us, to another party on our behalf, or to another party in accordance with its privacy policy. We may use cookies to bring together information we collect about you. You can choose to have your computer warn you each time a cookie is being placed on your device, or you can choose to block all cookies. You do this through your browser settings. Each browser is a little different, so look at your browser Help menu to learn the correct way to modify your cookies. If you turn cookies off, you won’t have access to many features that make your experience more efficient, and some of our services will not function properly.\nFlash cookies. We may use local shared objects, sometimes known as Flash cookies, to store your preferences or display content based upon what you view on our site to personalize your visit. Our third-party service providers also may use Flash cookies to collect and store information. Flash cookies are different from browser cookies because of the amount of, type of, and manner in which data is stored. Cookie management tools provided by your browser will not remove Flash cookies. Learn how to manage privacy and storage settings for Flash cookies. If you disable Flash cookies, you won’t have access to many features that make your experience more efficient, and some of our services will not function properly.\nWeb beacons. Web beacons are small pieces of data that are embedded in images on the pages of sites. Web beacons may involve the transmission of information directly to us, to another party on our behalf, or to another party in accordance with its privacy policy. We may use web beacons to bring together information we collect about you.\nDO NOT TRACK\nWeb browsers can transmit Do Not Track signals that indicate that a user does not wish to have activity tracked. Currently, no universally accepted standard exists for how to interpret such signals, although work to create consensus is ongoing. Learn about Do Not Track.\n\nSENSITIVE INFORMATION\nExcept as specifically requested or legally required (e.g., in the context of diversity hiring practices, health data collected pursuant to law or the demand of a government entity), we ask that you avoid submitting information which may qualify as sensitive or “special category” information under applicable law. Sensitive Personal Information may include Personal Information regarding your racial or ethnic origin; your political opinions, religious beliefs or other beliefs of a similar nature; whether you are a member of a trade union; data regarding your physical or mental health or condition; your sexual orientation; and data regarding the commission or alleged commission of any criminal offense.\n\nUSE OF INFORMATION\n\nA noted above, the member of The Walt Disney Family of Companies that is the Data Controller for your information is responsible for and may use your information for the purposes described in this VECTOR Privacy Notice. Other members of The Walt Disney Family of Companies may have access to your information where they perform services on behalf of the Data Controller (as a Data Processor) and, unless prohibited under applicable law, for use on their own behalf (as a Data Controller) for the purposes described in this VECTOR Privacy Notice. Consistent with applicable law and choices and controls that may be available to you, we may use information collected from you, or from devices associated with you for our business purposes, including to:\n\nProvide you with the services you request, view, or engage with;\nCommunicate with you about your account or transactions with us and send you information or request feedback about features on our sites and applications or changes to our policies;\nPersonalize content and experiences;\nProvide you with targeted advertising based on your activity on our sites and applications and on third-party sites and applications;\nTo learn more about how we use your information for personalization and tracking, please see Online Tracking Technologies and Advertising above.\nManage our suppliers, independent contractors, service providers and others throughout the supply chain;\nOrganize and implement tasks in preparation of or to perform existing contracts;\nEvaluate activities at our facilities, including compliance with applicable policies, as well as health and safety rules in place;\nGrant you access to our training and collaboration modules allowing you access to certain materials and services you are entitled to receive;\nManage and support our IT resources, including infrastructure management and business continuity;\nManage diversity information and career progression tracking;\nPreserve our economic interests and ensure compliance and reporting (such as complying with our policies and local legal requirements, tax and deductions, conducting audits, responding to complaints, and defending litigation); and\nArchiving and record-keeping.\nLEGAL REMEDIES AND REGULATORY COMPLIANCE\nIn addition, we will use your information as permitted by local law, to protect our rights including to: (a) enforce this VECTOR Privacy Notice and our terms and conditions; (b) to protect our rights, privacy, safety, or property, and\u002For that of our affiliates, you or others; and (c) to allow us to pursue available remedies or limit the damages that we may sustain.\n\nWhere required, we will use such information to:\ncomply with or evaluate compliance with any applicable law or regulation; and\nrespond to requests from public and government authorities, including public and government authorities outside your country of residence.\nCORPORATE TRANSACTIONS\nYour Personal Information may be used by us to complete a corporate transaction, such as a proposed or actual reorganization, merger, sale, joint venture, assignment, transfer or other disposition of all or any portion of our businesses, assets, or stock (including in connection with any bankruptcy or similar proceedings).\n\nDISCLOSURE OF PERSONAL INFORMATION\n\nWe may share Personal Information within The Walt Disney Family of Companies for the purposes described in this VECTOR Privacy Notice. We will make the information available to personnel with a need to know the information for the purposes described in this VECTOR Privacy Notice. In the course of our activities and for the same purposes as those listed in this VECTOR Privacy Notice, your Personal Information can be accessed by or transferred to the following categories of recipients on a need to know basis to achieve such purpose:\n\nour banks and other payment processing service providers;\nour IT systems providers, cloud service providers, database providers and consultants;\nour other suppliers and service providers that provide services and products to us;\nour professional service providers, such as accountants, auditors, legal advisors and insurance brokers; and\nour archive storage providers; and\nother third parties or entities as disclosed in this VECTOR Privacy Notice and permitted by law.\nDATA RETENTION\n\nWe will retain your Personal Information for the period necessary to fulfill the purposes outlined in this VECTOR Privacy Notice unless a longer retention period is required or permitted by applicable law.\n\nACCESS AND CORRECTION\n\nCertain websites and applications we provide may permit you to access, review, and change your Personal Information by logging in and updating your account information. Please note that if you change or correct information after submitting it, such changes will be visible to us.\n\nApart from such information, you may request access to your Personal Information that we collect, or its modification, correction, or deletion, where permitted by applicable law. For your protection, we may only implement requests with respect to the information associated with the particular email address that you use to send us your request, and we may need to verify your identity before responding to your request. We will try to comply with your request as soon as reasonably practicable. Please note that certain Personal Information may be exempt from such access, correction, or suppression rights pursuant to local data protection laws.\n\nSECURITY\n\nThe security, integrity, and confidentiality of your information are extremely important to us. We have implemented appropriate technical, administrative, organizational, and physical security measures that are designed to protect your information from unauthorized access, disclosure, use, and modification. We regularly review our security procedures to consider appropriate new technology and methods. Please be aware that, despite our best efforts, no security measures are perfect or impenetrable.\n\nLINKS TO THIRD-PARTY WEBSITES\n\nOur sites may contain links to other websites. This VECTOR Privacy Notice does not address, and we are not responsible for, the privacy, information security, or other practices of any third parties, including any third party operating any website or service to which our sites link. Privacy choices you have made on third party websites or services will not apply to our use of the information we have collected directly through our sites and offline. We encourage you to be aware when you leave our sites and to read the legal notices posted on other sites, including their privacy policies.\n\nDATA TRANSFERS AND APPLICABLE LAW\n\nWe operate globally and may transfer your Personal Information to individual companies of The Walt Disney Family of Companies or third parties in locations around the world for the purposes described in this VECTOR Privacy Notice. Wherever your Personal Information is transferred, stored or processed by us, we will take reasonable steps to safeguard the privacy of your Personal Information. Additionally, when using or disclosing Personal Information transferred from the European Union, we use Standard Contractual Clauses approved by the European Commission, adopt other means under European Union law for ensuring adequate safeguards, or obtain your consent. We also apply the substantive requirements of standard contractual clauses when transferring Personal Information from Australia and Argentina.\n\nCHANGES TO THIS VECTOR PRIVACY NOTICE\n\nFrom time to time, we may change this VECTOR Privacy Notice to accommodate new technologies, industry practices, regulatory requirements or for other purposes. We will provide notice to you if these changes are material and, where required by applicable law, we will obtain your consent. Notice may be by email to you at the last email address you provided us, by posting notice of such changes on our sites and applications, or by other means, consistent with applicable law.\n\nCONTACT US\n\nIf you have questions or requests related to this VECTOR Privacy Notice, please feel free to contact us by mail at: CORP.Disney.Privacy.Team@disney.com. If you are unsatisfied with a reply received from us, you may at any time refer your complaint to the relevant regulator in your jurisdiction.\n\nAdditional Information for the EEA Only\nIf you are a resident of the UK or EEA, you may also:\n\nContact our Data Protection Officer at DataProtection@disney.co.uk with any questions about this VECTOR Privacy Notice.\nLodge a complaint with a data protection authority for your country or region or in the place of the alleged misconduct.\nDEFINITIONS\nData Controller\nThe Data Controller is the subsidiary or affiliated entity of The Walt Disney Company that is responsible for the Personal Information collected and used within the scope of this VECTOR Privacy Notice from our sites and applications, as follows:\n\nIf you live in Europe, Middle East or Africa: The Walt Disney Company Limited (Company Number 530051) 3 Queen Caroline Street Hammersmith London W6 9PE help@disney.co.uk\nUS, Canada and Rest of World: Disney Interactive 500 South Buena Vista Street Mail Code 7667 Burbank, CA 91521-7667 United States of America Guest Services\nData Processor\nA data processor is a person or entity that processes Personal Information on behalf of a Data Controller (or Data Controllers) and is permitted to perform data processing only as directed by the Data Controller(s).\n\nPersonal Information\n\nPersonal Information means information that identifies, relates to, describes, is capable of being associated with, or could reasonably be linked (whether directly or indirectly) with a particular individual or household, such as the individual’s name, postal address, email address, and telephone number. When anonymous information is directly or indirectly associated with Personal Information, the resulting information also is treated as Personal Information.\n\nThe Walt Disney Family Of Companies\n\nThe Walt Disney Family of Companies refers to The Walt Disney Company and its subsidiary and affiliated entities, which offer their products and services under various brand names. These companies, including certain former 21st Century Fox assets, engage in a number of businesses, including theme parks and travel, motion pictures and television, publishing, consumer products and interactive services.","MOBILE_FULLSCREEN_UNAVAILABLE":"Full screen mode is not available on mobile, please visit Debut on your desktop or on one of our apps.","AUTH_LOGIN_CODE_TITLE":"Access Code","AUTH_LOGIN_EMAIL_ENTER_PASSWORD":"Enter your password","WEB_VPPA_TC_BTN":"I Agree","AUTH_WELCOME_BACK_TO_LOGIN_BUTTON":"Back to Log In","GTAG_TWDS_MUSICBYJOHNWILLIAMS_AW":"{    \"type\": \"AW\",    \"send_to\": \"AW-709852883\u002FqFEjCIrKgeoZENP9vdIC\"}","AUTH_TWO-FACTOR-AUTH_INSTALL_TITLE":"Step 1 Install App","AUTH_LOGIN_ACCESS_CODE_BUTTON":"Log In with Access Code","AUTH_RESET_PASSWORD_UPPER_CASE_SET":"Upper case letters (A-Z)","AUTH_TWO-FACTOR-AUTH_ENTER-CODE_CTA":"Enable Authentication","PROXIS_INFORMATION_WEB":"For the highest quality of this content, please watch on the Debut app available on Apple tvOS","AUTH_WELCOME_INVALID_TOKEN":"Unfortunately, your invitation has expired. Please request a new invitation from support@disneydebut.com.","GTAG_TWDS_INDIANA_JONES_DC":"{\n    \"type\": \"DC\",\n    \"send_to\": \"DC-3944448\u002Fth_aw01y\u002Fth_aw0+standard\",\n    \"img_src\": \"https:\u002F\u002Fad.doubleclick.net\u002Fddm\u002Factivity\u002Fsrc=3944448;type=th_aw01y;cat=th_aw0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;gdpr=${GDPR};gdpr_consent=${GDPR_CONSENT_755};ord=1?\"\n}","GTAG_TWDS_ONCE_UPON_A_STUDIO_DC":"{\n    \"type\": \"DC\",\n    \"send_to\": \"DC-3944448\u002Fth_aw023\u002Fth_aw0+standard\",\n    \"img_src\": \"https:\u002F\u002Fad.doubleclick.net\u002Fddm\u002Factivity\u002Fsrc=3944448;type=th_aw023;cat=th_aw0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;gdpr=${GDPR};gdpr_consent=${GDPR_CONSENT_755};ord=1?\"\n}","AUTH_RESET_PASSWORD_OLD_REQUIREMENTS":"Your password must include one digit, an upper and lower case character, and should be at least 8 characters in length.","GTAG_TWDS_ANDOR_DC":"{\n    \"type\": \"DC\",\n    \"send_to\": \"DC-3944448\u002Fth_aw01f\u002Fth_aw0+standard\",\n    \"img_src\": \"https:\u002F\u002Fad.doubleclick.net\u002Fddm\u002Factivity\u002Fsrc=3944448;type=th_aw01f;cat=th_aw0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;gdpr=${GDPR};gdpr_consent=${GDPR_CONSENT_755};ord=1?\"\n}","AUTH_WELCOME":"Please complete the form below.","AUTH_LOGIN_INACTIVE":"Unfortunately, your account is inactive. Please contact support@disneydebut.com.","GTAG_TWDS_HOCUSPOCUS_AW":"{\n    \"type\": \"AW\",\n    \"send_to\": \"AW-709852883\u002FUO2iCMesibsYENP9vdIC\"\n}","IOS_WEB_SCROLL_TC_VPPA":"Please scroll to the end of the entire Terms and Conditions & Data Sharing and Sharing Preferences before checking the boxes below.","GEN_CHILDRENS_ONLINE_PRIVACY_POLICY":"The Walt Disney Family of Companies (“TWDC”) is committed to protecting the privacy of children who use our sites and applications. This Children’s Online Privacy Policy explains our information collection, disclosure, and parental consent practices with respect to information provided by children under the age of 13 (“child” or “children”), and uses terms that are defined in our general Privacy Policy. This policy is in accordance with the U.S. Children’s Online Privacy Protection Act (“COPPA”), and outlines our practices in the United States regarding children’s personal information. For more information about COPPA and general tips about protecting children’s online privacy, please visit OnGuard Online.\n\nThe Walt Disney Company’s Child Directed Websites and Mobile Apps are included in PRIVO’s Kids Privacy Assured COPPA Safe Harbor Certification Program (“the Program”). The Program certification applies to the digital properties listed on the validation page that is viewable by clicking on the PRIVO seal. PRIVO is an independent, third-party organization committed to safeguarding children’s personal information collected online. PRIVO aims to help parents and their children exercise control over personal information while exploring the Internet. The PRIVO COPPA certification seal posted on this page indicates The Walt Disney Company has established COPPA compliant privacy practices and has agreed to submit to PRIVO’s oversight and consumer dispute resolution process. If you have questions or concerns about our privacy practices, please contact us at (877) 466-6669 or PRIVACYCONTACT@DISNEY.COM. If you have further concerns after you have contacted us, you can contact PRIVO directly at privacy@privo.com.\n\nACCORDION TOGGLE1. THE INFORMATION WE COLLECT FROM CHILDREN, HOW WE USE IT, AND HOW AND WHEN WE COMMUNICATE WITH PARENTS\nTWDC offers to its users a range of sites and applications, some of which are primarily targeted at children, and others that are intended for users of all ages and their families. Our sites and applications offer a variety of activities, including activities that may collect information from children. Below we summarize potential instances of collection and outline how and when we will provide parental notice and\u002For seek parental consent. In any instance that we collect personal information from a child, we will retain that information only so long as reasonably necessary to fulfill the activity request or allow the child to continue to participate in the activity, and ensure the security of our users and our services, or as required by law. In the event we discover we have collected information from a child in a manner inconsistent with COPPA’s requirements, we will either delete the information or immediately seek the parent’s consent for that collection.\n\nRegistration\n\nChildren can, in many cases, register with our sites and applications to view content, play games, participate in contests, and engage in special features, among other things. During the registration process, we may ask the child to provide certain information for notification and security purposes, including a parent or guardian’s email address, the child’s first name and gender, the child’s member or account username, and password. We also may ask for birth dates from children to validate their ages. We strongly advise children never to provide any personal information in their usernames. Please note that children can choose whether to share their information with us, but certain features cannot function without it. As a result, children may not be able to access certain features if required information has not been provided. We will not require a child to provide more information than is reasonably necessary in order to participate in an online activity.\n\nAbout the collection of parent email address: Consistent with the requirements of COPPA, on any child-targeted site or application, or in any instance where we ask for age and determine the user is age 12 or under, we will ask for a parent or guardian email address before we collect any personal information from the child. If you believe your child is participating in an activity that collects personal information and you or another parent\u002Fguardian have NOT received an email providing notice or seeking your consent, please feel free to contact us at privacycontact@disney.com. We will not use parent emails provided for parental consent purposes to market to the parent, unless the parent has expressly opted in to email marketing or has separately participated in an activity that allows for such email contact.\n\nContent Generated by a Child\n\nCertain activities on our sites and applications allow children to create or manipulate content and save it with TWDC. Some of these activities do not require children to provide any personal information and therefore may not result in notice to the parent or require parental consent. If an activity potentially allows a child to insert personal information in their created content, we will either pre-screen the submission to delete any personal information, or we will seek verifiable parental consent by email for the collection. Examples of created content that may include personal information are stories or other open-text fields, and drawings that allow text or free-hand entry of information. If, in addition to collecting content that includes personal information, TWDC also plans to post the content publicly or share it with a third party for the third party’s own use, we will obtain a higher level of parental consent.\n\nAbout Verifiable Parental Consent:\n\nEmail Consent. In the event TWDC wishes to collect personal information from a child, COPPA requires that we first seek a parent or guardian’s consent by email. In the email we will explain what information we are collecting, how we plan to use it, how the parent can provide consent, and how the parent can revoke consent. If we do not receive parental consent within a reasonable time, we will delete the parent contact information and any other information collected from the child in connection with that activity.\n\nHigh-Level Consent. In the event TWDC collects personal information from a child that will be posted publicly, we will seek a higher level of consent than email consent. Such “high-level” methods of consent include but are not limited to asking for a credit card or other payment method for verification (with a nominal charge involved), speaking to a trained customer service representative by telephone or video chat, or requiring a signed consent form by mail, email attachment, or fax. After providing high-level consent, a parent may have the opportunity to use a pin or password in future communications as a way to confirm the parent’s identity.\n\nTeacher consent in lieu of a parent. With regard to school-based activities, COPPA allows teachers and school administrators to act in the stead of parents to provide consent for the collection of personal information from children. Schools should always notify parents about these activities. For more information on parental rights with respect to a child’s educational record under the Family Educational Rights and Privacy Act (FERPA), please visit the FERPA site.\n\nChat\n\nCertain games and activities that are directed to children allow users to communicate directly with other users by means of a chat system. In most cases, these chat systems employ filters that are intended to prevent the communication of both personal information and age-inappropriate words and phrases. In addition to filters, we may employ live moderation and\u002For encourage other users to flag inappropriate communications. We strongly encourage children who use these interactive features on our sites and applications never to provide personal information about themselves or any third party, and certainly never to attempt to circumvent our filters or moderation. We also recommend that parents carefully supervise their children when the children participate in online activities.\n\nWhere TWDC employs a chat system that does not filter all or nearly all personal information, we will first seek high-level consent from the parent.\n\nContests and Sweepstakes\n\nFor contests and sweepstakes, we typically require only the information necessary for a child to participate, such as first name (to distinguish among family members) and parent email address (to notify the parent where required by law). We only contact the parent for more personalized information for prize-fulfillment purposes when the child wins the contest or sweepstakes.\n\nOf course, some contests and sweepstakes ask the child to submit their own created content along with the child’s entry. In those instances, we may require parental consent prior to submission. Please see Content Generated by a Child above for more information on our collection, notice, and consent policies.\n\nEmail Contact with a Child\n\nOn occasion, in order to respond to a question or request from a child, TWDC may need to ask for the child’s online contact information, such as an email address. TWDC will delete this information immediately after responding to the question or request.\n\nIn connection with certain activities or services, we may collect a child’s online contact information, such as an email address, in order to communicate with the child more than once. In such instances we will retain the child’s online contact information to honor the request and for no other purpose such as marketing. One example would be a newsletter that provides occasional updates about a site, game\u002Factivity, television show, personality\u002Fcharacter, or feature movie. Whenever we collect a child’s online contact information for ongoing communications, we will simultaneously require a parent email address in order to notify the parent about the collection and use of the child’s information, as well as to provide the parent an opportunity to prevent further contact with the child. On some occasions a child may be engaged in more than one ongoing communication, and a parent may be required to “opt-out” of each communication individually.\n\nPush Notifications\n\nPush notifications are notifications on mobile and other devices that are typically associated with downloaded applications, and which can communicate to the device holder even when the application is not in use. We will require a child to provide a parent email address before the child can receive push notifications from our child-directed applications that collect a device identifier. We will then provide the parent with notice of our contact with the child and will provide the parent the opportunity to prevent further notifications. Finally, we will not associate the device identifier with other personal information without contacting the parent to get consent.\n\nGeolocation Data\n\nIf a child-directed TWDC site or application collects geolocation information that is specific enough to equate to the collection of a street address, we will first seek parental consent via email.\n\nPersistent Identifiers\n\nWhen children interact with us, certain information may automatically be collected, both to make our sites and applications more interesting and useful to children and for various purposes related to our business. Examples include the type of computer operating system, the child’s IP address or mobile device identifier, the web browser, the frequency with which the child visits various parts of our sites or applications, and information regarding the online or mobile service provider. This information is collected using technologies such as cookies, flash cookies, web beacons, and other unique identifiers (which we define under the “Online Tracking Technologies” section of our general Privacy Policy). This information may be collected by TWDC or by a third party. This data is principally used for internal purposes only, in order to:\n\nprovide children with access to features and activities on our sites and applications\ncustomize content and improve our sites and applications\nconduct research and analysis to address the performance of our sites and applications\ngenerate anonymous reporting for use by TWDC\nIn the event we collect (or allow others to collect) such information from children on our sites and applications for other purposes, we will notify parents and obtain consent prior to such collection.\n\nVisit the Third-Party Operators page to see the list of third-party operators who collect persistent identifiers on our sites and applications.\n\nPlease contact us at the mailing address, email, or phone number below with questions about the operators’ privacy policies and collection and use practices:\n\nDisney Interactive\n500 South Buena Vista Street\nMail Code 7667\nBurbank, CA 91521-7667\nUnited States of America\n\nPhone: (877) 466-6669\nEmail: privacycontact@disney.com\n\nACCORDION TOGGLE2. WHEN INFORMATION COLLECTED FROM CHILDREN IS AVAILABLE TO OTHERS\nIn addition to those rare instances where a child’s personal information is posted publicly (after receiving high-level parental consent), we also may share or disclose personal information collected from children in a limited number of instances, including the following:\n\nWe may share information with our service providers if necessary for them to perform a business, professional, or technology support function for us.\nWe may disclose personal information if permitted or required by law, for example, in response to a court order or a subpoena. To the extent permitted by applicable law, we also may disclose personal information collected from children (i) in response to a law enforcement or public agency’s (including schools or children services) request; (ii) if we believe disclosure may prevent the instigation of a crime, facilitate an investigation related to public safety or protect the safety of a child using our sites or applications; (iii) to protect the security or integrity of our sites, applications, and other technology, as well as the technology of our service providers; or (iv) enable us to take precautions against liability.\n\nACCORDION TOGGLE3. PARENTAL CHOICES AND CONTROLS\nAt any time, parents can refuse to permit us to collect further personal information from their children in association with a particular account, and can request that we delete from our records the personal information we have collected in connection with that account. Please keep in mind that a request to delete records may lead to a termination of an account, membership, or other service.\n\nWhere a child has registered for a Disney.com account, we use two methods to allow parents to access, change, or delete the personally identifiable information that we have collected from their children:\n\n Parents can request access to and delete their child’s personal information by logging on to the child’s account through the Member Services Home Page. Parents will need their child’s username and password. The Your Account home page explains how to recover a password if the child cannot recall it.\nParents can contact Guest Services to request access to, change, or delete their child’s personal information by sending an email to us at ms_support@help.go.com. A valid request to delete personal information will be accommodated within a reasonable time.\nAny other inquiries may be directed to:\n\nDisney Interactive\n500 South Buena Vista Street\nMail Code 7667\nBurbank, CA 91521-7667\nUnited States of America\nPhone: (877) 466-6669 (US and Canada)\nEmail: privacycontact@disney.com\n\nIn any correspondence such as e-mail or mail, please include the child’s username and the parent’s email address and telephone number. To protect children’s privacy and security, we will take reasonable steps to help verify a parent’s identity before granting access to any personal information.","LICENSE_PLATE_ACTIVATE_MSG":"From your PC, phone or tablet go to:","GTAG_TWDS_XMEN97_AW":"{    \"type\": \"AW\",    \"send_to\": \"AW-709852883\u002FdRToCP20guoZENP9vdIC\"}","BROWSER_UNSUPPORTED":"Unfortunately, the browser you are using is not supported. Please consider using Safari or Google Chrome.","AUTH_LOGIN_EMAIL_FORGOT_PASSWORD_BUTTON":"Forgot Password","GTAG_TWDS_NOWSY_DC":"{\n    \"type\": \"DC\",\n    \"send_to\": \"DC-3944448\u002Fth_aw025\u002Fth_aw0+standard\",\n    \"img_src\": \"https:\u002F\u002Fad.doubleclick.net\u002Fddm\u002Factivity\u002Fsrc=3944448;type=th_aw025;cat=th_aw0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;gdpr=${GDPR};gdpr_consent=${GDPR_CONSENT_755};ord=1?\"\n}","GTAG_TWDS_MSMARVEL_DC":"{\n    \"type\": \"DC\",\n    \"send_to\": \"DC-3944448\u002Fth_aw01c\u002Fth_aw0+standard\",\n    \"img_src\": \"https:\u002F\u002Fad.doubleclick.net\u002Fddm\u002Factivity\u002Fsrc=3944448;type=th_aw01c;cat=th_aw0;dc_lat=;dc_rdid=;tag_for_child_directed_treatment=;tfua=;npa=;gdpr=${GDPR};gdpr_consent=${GDPR_CONSENT_755};ord=1?\"\n}","AUTH
