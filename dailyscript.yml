name: Daily Script matcher

on:
  workflow_dispatch:
  push:
    paths:
      - "movie_list.xlsx"
      - "src/**"
      - ".github/workflows/dailyscript.yml"

jobs:
  match:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Match movie list against Daily Script
        run: python src/dailyscript_matcher.py --input movie_list.xlsx --output DailyScript_results.xlsx

      - name: Upload matching results
        uses: actions/upload-artifact@v4
        with:
          name: dailyscript-results
          path: DailyScript_results.xlsx
